<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reto de las Letanías</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Letanías de la Virgen María</h1>
    <p>Escribe las letanías en el cuadro de abajo. ¡Suerte!</p>
    
    <input type="text" id="input-letania" placeholder="Escribe aquí...">

    <div id="opciones">
        <label>
            <input type="checkbox" id="check-temporizador" checked> Activar temporizador (5 min)
        </label>
    </div>

    <div id="tiempo">Tiempo: <span id="reloj">05:00</span></div>
    
    <div id="contador">Aciertos: 0 / 52</div>

    <button id="btn-reset">Reiniciar Juego</button>
    
    <button id="btn-rendirse">Rendirse / Ver respuestas</button>

    <div id="tabla-contenedor" class="grid-container"></div>

    <script src="script.js"></script>
</body>
</html>
